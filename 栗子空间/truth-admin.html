<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>栗子题库设置</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="栗子题库">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="truth-icon.png">
<style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    body {
        min-height: 100vh; display: flex; align-items: center; justify-content: center;
        padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
        background: linear-gradient(160deg, #f7ede1, #f3e3cd);
        font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .card {
        width: 100%; max-width: 420px; background: #fffaf2; border-radius: 18px;
        box-shadow: 0 16px 44px rgba(80, 50, 20, .18); padding: 22px 20px;
    }
    h1 { margin: 0 0 4px; font-size: 20px; color: #5b3a1e; }
    .sub { margin: 0 0 16px; font-size: 12.5px; color: #a58a6b; }
    label { display: block; font-size: 13.5px; color: #6b4a2b; font-weight: 600; margin: 14px 0 6px; }
    .hint { font-weight: 400; color: #b09a7d; font-size: 12px; }
    input, textarea {
        width: 100%; border: 1.5px solid #e2cbaa; border-radius: 12px; background: #fff;
        padding: 11px 12px; font-size: 14.5px; color: #4a331c; font-family: inherit; outline: none;
    }
    input:focus, textarea:focus { border-color: #b9804b; }
    textarea { min-height: 150px; resize: vertical; line-height: 1.7; font-size: 13.5px; }
    button {
        border: 0; border-radius: 12px; padding: 11px 0; font-size: 14.5px; font-weight: 600;
        cursor: pointer; font-family: inherit; width: 100%; margin-top: 10px;
        background: #efe3d2; color: #6b4a2b;
    }
    button:disabled { opacity: .55; }
    button.primary { background: linear-gradient(135deg, #8f5e33, #633a1e); color: #fff; box-shadow: 0 4px 12px rgba(99, 58, 30, .35); }
    .row { display: flex; gap: 8px; }
    .row button { flex: 1; margin-top: 10px; padding: 10px 0; font-size: 13px; }
    .cur {
        font-size: 12.5px; color: #6b4a2b; background: #f6ead8; border-radius: 10px;
        padding: 10px 12px; line-height: 1.7; word-break: break-all; white-space: pre-wrap;
    }
    .cats { display: flex; flex-wrap: wrap; gap: 7px; margin: 8px 0 2px; }
    .cat-chip {
        border: 1.5px solid #e2cbaa; background: #fff; color: #85532E; border-radius: 999px;
        padding: 6px 12px; font-size: 12.5px; font-weight: 600; cursor: pointer; font-family: inherit;
        width: auto; margin: 0;
    }
    .cat-chip.on { background: linear-gradient(135deg, #8f5e33, #633a1e); color: #fff; border-color: #633a1e; }
    .msg { font-size: 13px; min-height: 18px; margin: 12px 0 0; line-height: 1.55; word-break: break-all; }
    .ok { color: #2e7d32; } .err { color: #c0392b; } .gray { color: #8a7358; }
    #pinView input { text-align: center; letter-spacing: 3px; font-size: 17px; }
</style>
</head>
<body>
    <div id="pinView" class="card" hidden>
        <h1>🌰 栗子题库设置</h1>
        <p class="sub">仅空间主人使用 · 请输入管理口令（打错能看见）</p>
        <input id="pin" type="text" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" placeholder="管理口令">
        <button id="pinBtn" class="primary" onclick="window.__liziTikuUnlock && window.__liziTikuUnlock()">解 锁</button>
        <p id="pinMsg" class="msg err"></p>
    </div>

    <div id="panel" class="card" hidden>
        <h1>🌰 栗子题库设置</h1>
        <p class="sub">真心话大冒险 · 粘贴即可更新题库，保存后两人手机下次打开真心话即生效</p>
        <div id="bankInfo" class="cur">读取云端题库中…</div>
        <label>选择分类 <span class="hint">（下面粘贴的题目若不带「分类|」前缀，就归到这里）</span></label>
        <div id="catChips" class="cats"></div>
        <label>粘贴题目 <span class="hint">（一行一题；也可写「分类|题目」指定分类，如：走心|你最爱我哪一点）</span></label>
        <textarea id="paste" placeholder="例如：&#10;今天最想和我做的一件小事是什么？&#10;走心|哪一刻你确定我是爱你的？&#10;回忆|我们第一次约会你紧张吗？"></textarea>
        <button id="appendBtn" class="primary" onclick="bankAppend()">➕ 追加到所选分类（自动去重）</button>
        <div class="row" id="singleCatOps">
            <button onclick="bankReplace()">♻️ 用粘贴内容替换所选分类</button>
            <button onclick="bankClearCat()">🧹 清空所选分类</button>
            <button onclick="bankRestoreCat()">↩️ 该分类恢复内置题库</button>
        </div>
        <div class="row">
            <button id="undoBtn" onclick="bankUndo()">↩️ 撤销上一步</button>
            <button onclick="bankClearPaste()">🧹 清空粘贴区</button>
        </div>
        <div class="row">
            <button onclick="bankExport()">📤 查看·导出当前视图</button>
        </div>
        <button id="saveBtn" class="primary" onclick="bankSave()">💾 保存全部到云端（版本+1，两人手机生效）</button>
        <button id="undoPubBtn" onclick="bankUndoPublish()" hidden>⏪ 撤回上次发布（回到之前版本内容）</button>
        <p id="msg" class="msg gray"></p>
    </div>

<script src="admin-gateway.js?v=2" defer></script>

            var covered = workingOf(c.id) !== null;
            var n = effectiveOf(c.id).length;
            chips.push('<button type="button" class="cat-chip' + (c.id === selCat ? ' on' : '') + '" onclick="bankSelectCat(\'' + c.id + '\')">' +
                c.name.split('').slice(0, 2).join('') + ' ' + n + (covered ? '✏️' : '') + '</button>');
        });
        box.innerHTML = chips.join('');
    }

    function renderInfo() {
        var lines = [];
        lines.push('云端题库：' + (cur ? ('v' + (cur.version || 0) + ' · 更新于 ' + (cur.updatedAt || '?')) : '尚未发布（应用当前用内置 300 题）'));
        lines.push('—— 各分类（✏️=云端已覆盖，否则用内置）——');
        CATS.forEach(function (c) {
            var covered = workingOf(c.id) !== null;
            lines.push(c.name + '：' + (covered ? ('云端覆盖 ' + working[c.id].length + ' 题' + (dirty && cur && cur.qb && cur.qb[c.id] ? '（原 ' + cur.qb[c.id].length + '）' : '')) : ('未覆盖 · 内置 ' + builtinOf(c.id).length + ' 题')));
        });
        if (dirty) lines.push('● 有未保存的修改（保存前只在本页生效）');
        $('bankInfo').textContent = lines.join('\n');
    }

    function refresh() {
        renderCats();
        renderInfo();
        var all = (selCat === 'all');
        var ops = $('singleCatOps');
        if (ops) ops.classList.toggle('hidden', all);
        var ab = $('appendBtn');
        if (ab) ab.textContent = all ? '📥 一键粘贴导入（按「分类|题目」自动分类）' : '➕ 追加到所选分类（自动去重）';
        var ub = $('undoBtn');
        if (ub) ub.textContent = '↩️ 撤销上一步' + (undoStack.length ? '（' + undoStack.length + '）' : '');
        var up = $('undoPubBtn');
        if (up) up.hidden = !lastPublish;
    }

    // 解析粘贴内容：一行一题，支持「分类|题目」前缀（全角｜也认）
    function parsePaste() {
        var raw = $('paste').value.split('\n');
        var out = [];
        raw.forEach(function (line) {
            var s = line.replace(/\r/g, '').trim();
            if (!s) return;
            var cat = selCat, q = s;
            var i = s.search(/[|｜]/);
            if (i > 0) {
                var head = s.slice(0, i).replace(/[|｜]/g, '').trim();
                var rest = s.slice(i + 1).trim();
                if (ALIAS[head] && rest) { cat = ALIAS[head]; q = rest; }
            }
            out.push({ cat: cat, q: q });
        });
        return out;
    }

    window.bankSelectCat = function (id) {
        if (id === selCat) return;
        if (!pasteIsAuto && $('paste').value.trim()) {
            if (!confirm('粘贴区有未处理的内容，切换视图会覆盖它。继续切换？')) return;
        }
        selCat = id;
        refresh();
        showCatInTextarea(false);
    };
    function snapUndo(label) {
        undoStack.push({ label: label, working: JSON.parse(JSON.stringify(working)), selCat: selCat, dirty: dirty, paste: $('paste').value });
        if (undoStack.length > 30) undoStack.shift();
    }

    window.bankAppend = function () {
        if (selCat === 'all') { bankImportAll(); return; }
        var items = parsePaste();
        if (!items.length) { msg('粘贴区是空的：一行一题贴进来～', 'err'); return; }
        snapUndo('追加到' + catName(selCat));
        var added = 0, dup = 0;
        items.forEach(function (it) {
            var arr = workingOf(it.cat);
            if (arr === null) { arr = builtinOf(it.cat).slice(); working[it.cat] = arr; }
            var effSet = {};
            effectiveOf(it.cat).forEach(function (q) { effSet[q] = 1; });
            if (arr.indexOf(it.q) >= 0 || effSet[it.q]) { dup++; return; }
            arr.push(it.q);
            added++;
        });
        if (!added) { if (undoStack.length) undoStack.pop(); refresh(); msg('没有新增：' + (dup ? dup + ' 题都已存在' : '没有可加入的题目') + '。', 'gray'); return; }
        dirty = true;
        $('paste').value = '';
        pasteIsAuto = true;
        refresh();
        msg('✅ 已加入 ' + added + ' 题' + (dup ? ('，跳过重复 ' + dup + ' 题') : '') + '。记得点「保存全部到云端」。', 'ok');
    };

    // 一键导入（全部）：按「分类|题目」前缀自动分类，无前缀的行跳过
    function bankImportAll() {
        var raw = $('paste').value.split('\n');
        var parsed = [], skip = 0;
        raw.forEach(function (line) {
            var s = line.replace(/\r/g, '').trim();
            if (!s) return;
            var i = s.search(/[|｜]/);
            if (i <= 0) { skip++; return; }
            var head = s.slice(0, i).replace(/[|｜]/g, '').trim();
            var rest = s.slice(i + 1).trim();
            if (!ALIAS[head] || !rest) { skip++; return; }
            parsed.push({ cat: ALIAS[head], q: rest });
        });
        if (!parsed.length) { msg('没有可自动分类的行：每行需要「分类|题目」格式（如：走心|你最爱我哪一点）。', 'err'); return; }
        snapUndo('一键导入');
        var added = 0, dup = 0, perCat = {};
        parsed.forEach(function (it) {
            var arr = workingOf(it.cat);
            if (arr === null) { arr = builtinOf(it.cat).slice(); working[it.cat] = arr; }
            var effSet = {};
            effectiveOf(it.cat).forEach(function (q) { effSet[q] = 1; });
            if (arr.indexOf(it.q) >= 0 || effSet[it.q]) { dup++; return; }
            arr.push(it.q);
            added++;
            perCat[it.cat] = (perCat[it.cat] || 0) + 1;
        });
        if (!added) { if (undoStack.length) undoStack.pop(); refresh(); msg('没有新增：' + dup + ' 题都已存在' + (skip ? ('，跳过无前缀行 ' + skip) : '') + '。', 'gray'); return; }
        dirty = true;
        $('paste').value = '';
        pasteIsAuto = true;
        refresh();
        var detail = CATS.filter(function (c) { return perCat[c.id]; }).map(function (c) { return c.name.split('').slice(0, 2).join('') + ' +' + perCat[c.id]; }).join('，');
        msg('✅ 一键导入 ' + added + ' 题（' + detail + '）' + (dup ? ('，重复跳过 ' + dup) : '') + (skip ? ('，无前缀跳过 ' + skip) : '') + '。记得保存。', 'ok');
    }
    window.bankReplace = function () {
        var items = parsePaste();
        if (!items.length) { msg('粘贴区是空的：一行一题贴进来～', 'err'); return; }
        snapUndo('替换' + catName(selCat));
        working[selCat] = [];
        var added = 0, other = 0;
        items.forEach(function (it) {
            if (it.cat !== selCat) { other++; }
            var arr = workingOf(it.cat);
            if (arr === null) { arr = builtinOf(it.cat).slice(); working[it.cat] = arr; }
            if (arr.indexOf(it.q) >= 0) return;
            arr.push(it.q);
            added++;
        });
        dirty = true;
        $('paste').value = '';
        pasteIsAuto = true;
        refresh();
        showCatInTextarea(false);
        msg('♻️ 所选分类已替换（共 ' + added + ' 题' + (other ? ('，其中 ' + other + ' 题按前缀归入了其他分类') : '') + '）。记得保存。', 'ok');
    };
    window.bankClearCat = function () {
        if (!confirm('清空「' + catName(selCat) + '」？保存后抽题时该分类将没有题目。')) return;
        snapUndo('清空' + catName(selCat));
        working[selCat] = [];
        dirty = true;
        refresh();
        msg('🧹 已清空「' + catName(selCat) + '」（还没保存）。', 'ok');
    };
    window.bankRestoreCat = function () {
        snapUndo('恢复内置' + catName(selCat));
        delete working[selCat];
        dirty = true;
        refresh();
        msg('↩️ 「' + catName(selCat) + '」已改为使用内置题库（保存后生效）。', 'ok');
    };
    // 当前视图展示：全部 = 全量带前缀；单分类 = 该分类纯题目
    function showCatInTextarea(withSnap) {
        var lines = [];
        if (selCat === 'all') {
            CATS.forEach(function (c) {
                effectiveOf(c.id).forEach(function (q) { lines.push(c.name + '|' + q); });
            });
        } else {
            effectiveOf(selCat).forEach(function (q) { lines.push(q); });
        }
        if (withSnap) snapUndo('查看/导出' + (selCat === 'all' ? '全部' : catName(selCat)));
        $('paste').value = lines.join('\n');
        pasteIsAuto = true;
        refresh();
    }

    window.bankExport = function () {
        if (!pasteIsAuto && $('paste').value.trim()) {
            if (!confirm('粘贴区有未处理的内容，查看/导出会覆盖它。继续？')) return;
        }
        showCatInTextarea(true);
        var label = (selCat === 'all') ? '全部' : catName(selCat);
        msg('📋 已展示「' + label + '」共 ' + $('paste').value.split('\n').length + ' 题。可直接编辑后用「替换所选分类」保存修改；要粘贴新题请先清空粘贴区。', 'gray');
    };

    window.bankClearPaste = function () {
        snapUndo('清空粘贴区');
        $('paste').value = '';
        pasteIsAuto = true;
        refresh();
        msg('🧹 粘贴区已清空，可以贴新题了（可撤销）。', 'gray');
    };

    window.bankUndo = function () {
        if (!undoStack.length) { msg('没有可撤销的操作了。', 'gray'); return; }
        var s = undoStack.pop();
        working = s.working;
        selCat = s.selCat;
        dirty = s.dirty;
        $('paste').value = s.paste || '';
        pasteIsAuto = false;
        refresh();
        msg('↩️ 已撤销：' + s.label + '（还没保存到云端）', 'ok');
    };

    window.bankUndoPublish = function () {
        if (!lastPublish || !window.LiziGW || !window.LiziGW.put) { msg('没有可撤回的发布。', 'gray'); return; }
        if (!confirm('撤回本次发布？云端题库将恢复到上一版内容（版本号继续+1）。')) return;
        busy(true); msg('撤回中…', 'gray');
        var redo = cur ? JSON.parse(JSON.stringify(cur)) : null;
        var doc = JSON.parse(JSON.stringify(lastPublish));
        doc.version = ((cur && cur.version) || 0) + 1;
        doc.updatedAt = new Date().toISOString().replace('T', ' ').slice(0, 16);
        window.LiziGW.put(BANK_PATH, doc).then(function () {
            lastPublish = redo;
            try { localStorage.setItem('lizi_tiku_prevdoc', JSON.stringify({ doc: redo })); } catch (e) { }
            cur = doc;
            working = JSON.parse(JSON.stringify(doc.qb || {}));
            dirty = false;
            refresh();
            msg('⏪ 已撤回：云端现在是 v' + doc.version + '（内容为上一版）。', 'ok');
        }).catch(function (e) {
            msg('撤回失败：' + (e && e.message ? e.message : e), 'err');
        }).finally(function () { busy(false); });
    };
    window.bankSave = function () {
        if (!window.LiziGW || !window.LiziGW.put) { msg('网关模块未加载，请刷新页面重试。', 'err'); return; }
        var total = 0;
        CATS.forEach(function (c) { total += effectiveOf(c.id).length; });
        if (total === 0) { msg('整个题库是空的，至少留一道题（或恢复内置）。', 'err'); return; }
        if (!confirm('保存到云端？两人手机下次打开真心话就会用新题库。')) return;
        busy(true); msg('保存中…', 'gray');
        var doc = {
            version: ((cur && cur.version) || 0) + 1,
            updatedAt: new Date().toISOString().replace('T', ' ').slice(0, 16),
            qb: working
        };
        window.LiziGW.put(BANK_PATH, doc).then(function () {
            cur = doc;
            dirty = false;
            refresh();
            msg('✅ 已保存 v' + doc.version + '。两人手机下次进入「真心话说一说」自动生效（正在开着的话，重新进一次）。', 'ok');
        }).catch(function (e) {
            msg('保存失败：' + (e && e.message ? e.message : e) +
                (String(e && e.message).indexOf('403') >= 0 ? '（页面来源不在放行名单，请用 tcloudbaseapp.com 域名打开）' : ''), 'err');
        }).finally(function () { busy(false); });
    };

    function load() {
        if (!window.LiziGW || !window.LiziGW.get) { msg('网关模块未加载，请刷新页面重试。', 'err'); return; }
        try { var pv = JSON.parse(localStorage.getItem('lizi_tiku_prevdoc') || 'null'); lastPublish = (pv && pv.doc) ? pv.doc : null; } catch (e) { lastPublish = null; }
        busy(true); msg('读取中…', 'gray');
        window.LiziGW.get(BANK_PATH).then(function (o) {
            cur = o || null;
            working = (o && o.qb && typeof o.qb === 'object') ? JSON.parse(JSON.stringify(o.qb)) : {};
            refresh();
            msg(o ? '已读取云端题库 v' + (o.version || 0) + '。' : '云端还没有题库，当前应用使用内置 300 题；保存后将开始云端覆盖。', o ? 'ok' : 'gray');
        }).catch(function (e) {
            msg('读取失败：' + (e && e.message ? e.message : e) +
                (String(e && e.message).indexOf('403') >= 0 ? '（页面来源不在放行名单）' : ''), 'err');
        }).finally(function () { busy(false); });
    }

    function tryUnlock() {
        if (normPin($('pin').value) === normPin(PIN)) {
            try { sessionStorage.setItem('lizi_tiku_ok', '1'); } catch (e) { }
            $('pinView').hidden = true;
            $('panel').hidden = false;
            load();
        } else {
            $('pinMsg').textContent = '口令不对，再想想～（会忽略大小写/空格）';
            $('pin').value = '';
        }
    }
    window.__liziTikuUnlock = tryUnlock;
    $('pinBtn').addEventListener('click', tryUnlock);
    $('pin').addEventListener('keydown', function (e) { if (e.key === 'Enter') tryUnlock(); });
    $('paste').addEventListener('input', function () { pasteIsAuto = false; }); // 用户手动改过粘贴区，切视图前要提醒

    var ok = false;
    try { ok = sessionStorage.getItem('lizi_tiku_ok') === '1'; } catch (e) { }
    if (ok) { $('pinView').hidden = true; $('panel').hidden = false; load(); }
    else { $('pinView').hidden = false; $('panel').hidden = true; }
})();
</script>
</body>
</html>
